<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1024" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="cyberGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00b4d8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="scanlineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0" />
      <stop offset="50%" stop-color="#00ff9d" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#162544" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 1px;
      fill: #94a3b8;
    }
    .pill-text {
      font-family: 'SF Mono', Monaco, Consolas, 'Courier New', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #00ff9d;
    }
    .code-accent {
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 13px;
      fill: #38bdf8;
    }
  </style>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Cyber Grid -->
  <rect width="1200" height="360" fill="url(#cyberGrid)" />

  <!-- DYNAMIC ANIMATED BACKGROUND LAYER -->
  <g id="dynamic-bg" opacity="0.65">
    <!-- Animated Radar Pulse Rings (Left Side) -->
    <circle cx="140" cy="180" r="30" stroke="#00ff9d" stroke-width="1.5" fill="none">
      <animate attributeName="r" values="20;160" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="140" cy="180" r="30" stroke="#00d2ff" stroke-width="1" fill="none">
      <animate attributeName="r" values="40;200" dur="4s" begin="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0" dur="4s" begin="1.5s" repeatCount="indefinite" />
    </circle>

    <!-- Radar Sweep Line -->
    <line x1="140" y1="180" x2="260" y2="180" stroke="#00ff9d" stroke-width="1.5" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0 140 180" to="360 140 180" dur="6s" repeatCount="indefinite" />
    </line>

    <!-- Animated Circuit Nodes on Right Side -->
    <g stroke="#1e293b" stroke-width="1.5" fill="none">
      <path d="M 980 60 L 1050 120 L 1150 120" />
      <path d="M 920 180 L 1020 180 L 1080 240 L 1160 240" />
      <path d="M 960 300 L 1040 240 L 1120 300" />
    </g>

    <!-- Moving Data Packets along Circuits -->
    <circle r="4" fill="#00ff9d" filter="url(#glowGreen)">
      <animate attributeName="cx" values="980;1050;1150" dur="3s" repeatCount="indefinite" />
      <animate attributeName="cy" values="60;120;120" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle r="4" fill="#38bdf8" filter="url(#glowCyan)">
      <animate attributeName="cx" values="920;1020;1080;1160" dur="4.2s" begin="1s" repeatCount="indefinite" />
      <animate attributeName="cy" values="180;180;240;240" dur="4.2s" begin="1s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="4.2s" begin="1s" repeatCount="indefinite" />
    </circle>
    <circle r="3.5" fill="#e879f9" filter="url(#glowGreen)">
      <animate attributeName="cx" values="960;1040;1120" dur="3.5s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="cy" values="300;240;300" dur="3.5s" begin="0.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="0.5s" repeatCount="indefinite" />
    </circle>

    <!-- Animated Vertical Scanline Across the Frame -->
    <line x1="0" y1="0" x2="1200" y2="0" stroke="url(#scanlineGrad)" stroke-width="2.5" opacity="0.35">
      <animate attributeName="y1" values="0;360;0" dur="8s" repeatCount="indefinite" />
      <animate attributeName="y2" values="0;360;0" dur="8s" repeatCount="indefinite" />
    </line>

    <!-- Glowing Background Ambient Orbs -->
    <circle cx="280" cy="80" r="140" fill="#00ff9d" opacity="0.04" filter="url(#glowGreen)" />
    <circle cx="950" cy="260" r="160" fill="#00d2ff" opacity="0.05" filter="url(#glowCyan)" />
  </g>

  <!-- FOREGROUND STATIC & HIGH-CONTRAST CONTENT (Guaranteed Crisp & Legible) -->
  <g id="foreground-content">
    <!-- Cyber Shield Emblem & Core Icon -->
    <g transform="translate(100, 135)">
      <!-- Outer Shield Glow -->
      <polygon points="40,5 75,18 75,55 40,80 5,55 5,18" fill="url(#shieldGrad)" opacity="0.2" filter="url(#glowGreen)" />
      <!-- Shield Border -->
      <polygon points="40,5 75,18 75,55 40,80 5,55 5,18" fill="#0b1329" stroke="url(#cyberGreenGrad)" stroke-width="2.5" />
      <!-- Inner Crosshair / Target Symbol -->
      <circle cx="40" cy="42" r="15" fill="none" stroke="#00ff9d" stroke-width="1.8" stroke-dasharray="4,2" />
      <circle cx="40" cy="42" r="6" fill="#00ff9d" />
      <line x1="40" y1="20" x2="40" y2="28" stroke="#00ff9d" stroke-width="2" />
      <line x1="40" y1="56" x2="40" y2="64" stroke="#00ff9d" stroke-width="2" />
      <line x1="18" y1="42" x2="26" y2="42" stroke="#00ff9d" stroke-width="2" />
      <line x1="54" y1="42" x2="62" y2="42" stroke="#00ff9d" stroke-width="2" />
    </g>

    <!-- Terminal Prompt / Status Badge -->
    <g transform="translate(210, 80)">
      <rect width="270" height="26" rx="13" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <circle cx="15" cy="13" r="4" fill="#22c55e">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="17" class="code-accent">RED_TEAM_OPS // ENGAGE_ACTIVE</text>
    </g>

    <!-- Main Title -->
    <text x="210" y="152" font-size="34" class="title-text">
      AWESOME PENETRATION TESTING FRAMEWORKS
    </text>

    <!-- Gradient Accent Rule Under Title -->
    <rect x="210" y="168" width="560" height="3" fill="url(#cyberGreenGrad)" rx="1.5" />

    <!-- Subtitle -->
    <text x="210" y="206" font-size="16" class="subtitle-text">
      Curated Directory of C2 Frameworks, Adversary Simulation &amp; Post-Exploitation Tooling
    </text>

    <!-- Feature Pills / Tags in Foreground -->
    <g transform="translate(210, 240)">
      <!-- Pill 1: Adversary Simulation -->
      <g transform="translate(0, 0)">
        <rect width="180" height="28" rx="6" fill="#0b172a" stroke="#00ff9d" stroke-width="1.2" />
        <text x="90" y="18" text-anchor="middle" class="pill-text">⚔️ ADVERSARY SIMULATION</text>
      </g>
      <!-- Pill 2: Command & Control -->
      <g transform="translate(192, 0)">
        <rect width="170" height="28" rx="6" fill="#0b172a" stroke="#00d2ff" stroke-width="1.2" />
        <text x="85" y="18" text-anchor="middle" class="pill-text" fill="#00d2ff">📡 COMMAND &amp; CONTROL</text>
      </g>
      <!-- Pill 3: Post-Exploitation -->
      <g transform="translate(374, 0)">
        <rect width="168" height="28" rx="6" fill="#0b172a" stroke="#a855f7" stroke-width="1.2" />
        <text x="84" y="18" text-anchor="middle" class="pill-text" fill="#c084fc">🔓 POST-EXPLOITATION</text>
      </g>
      <!-- Pill 4: Automated PTaaS -->
      <g transform="translate(554, 0)">
        <rect width="168" height="28" rx="6" fill="#0b172a" stroke="#f43f5e" stroke-width="1.2" />
        <text x="84" y="18" text-anchor="middle" class="pill-text" fill="#fb7185">🤖 CONTINUOUS PTAAS</text>
      </g>
    </g>

    <!-- Stats / Year Marker -->
    <g transform="translate(210, 298)">
      <text x="0" y="12" font-family="'SF Mono', Monaco, monospace" font-size="11" fill="#64748b">
        ECOSYSTEM TRACKER • 2026 EDITION • OPEN SOURCE &amp; ENTERPRISE PLATFORMS
      </text>
    </g>
  </g>

  <!-- Glowing Outer Frame Border -->
  <rect x="1" y="1" width="1198" height="358" rx="10" fill="none" stroke="url(#cyberGreenGrad)" stroke-width="1.5" opacity="0.4" />
</svg>
